name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:  # ручной запуск для отладки

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            ext: ''
          - target: windows
            ext: '.exe'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@latest

      # --- GUI ---
      - name: Build GUI with fyne-cross
        run: |
          fyne-cross ${{ matrix.target }} \
            -arch=amd64 \
            -icon assets/icons/icon.png \
            -app-id io.github.rurewa.codepic \
            -name codepic \
            -ldflags=-s \
            -ldflags=-w \
            ./cmd/codepic

      - name: Debug - list fyne-cross output
        run: |
          echo "=== fyne-cross/dist/${{ matrix.target }}-amd64 ==="
          ls -lah fyne-cross/dist/${{ matrix.target }}-amd64/ || true

      # --- CLI ---
      - name: Build CLI
        run: |
          if [ "${{ matrix.target }}" = "linux" ]; then
            CGO_ENABLED=0 go build -ldflags="-s -w" -o codepic-cli-linux-amd64 ./cmd/codepic-cli
          else
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o codepic-cli-windows-amd64.exe ./cmd/codepic-cli
          fi

      # --- Установка nfpm (только Linux) ---
      - name: Install nfpm
        if: matrix.target == 'linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      # --- .deb и .rpm ---
      - name: Build .deb and .rpm
        if: matrix.target == 'linux'
        run: |
          # 1. Распаковываем архив, созданный fyne-cross
          mkdir -p extracted
          ARCHIVE=$(find fyne-cross/dist/linux-amd64 -maxdepth 1 -name '*.tar.xz' | head -n1)
          if [ -z "$ARCHIVE" ]; then
            echo "❌ Не найден .tar.xz в fyne-cross/dist/linux-amd64/"
            ls -R fyne-cross/dist/linux-amd64/
            exit 1
          fi
          echo "Найден архив: $ARCHIVE"
          tar -xf "$ARCHIVE" -C extracted

          # 2. Ищем бинарник
          BIN_PATH=$(find extracted -type f -name 'codepic' | head -n1)
          if [ -z "$BIN_PATH" ]; then
            echo "❌ Не найден бинарник codepic в распакованном архиве"
            ls -R extracted/
            exit 1
          fi
          echo "Найден бинарник: $BIN_PATH"

          # 3. Готовим пакет
          mkdir -p package-root/usr/bin artifacts
          cp "$BIN_PATH" package-root/usr/bin/codepic
          chmod +x package-root/usr/bin/codepic

          # 4. nfpm.yaml
          cat > nfpm.yaml <<EOF
          name: "codepic"
          arch: "amd64"
          platform: "linux"
          version: "${GITHUB_REF_NAME#v}"
          section: "utils"
          priority: "optional"
          maintainer: "rurewa"
          description: "Local code screenshotter for messengers"
          vendor: "rurewa"
          homepage: "https://github.com/rurewa/codepic-app"
          license: "MIT"
          contents:
            - src: package-root/usr/bin/codepic
              dst: /usr/bin/codepic
            - src: assets/icons/icon.png
              dst: /usr/share/icons/hicolor/256x256/apps/codepic.png
          EOF

          nfpm package --packager deb --target artifacts/ -f nfpm.yaml
          nfpm package --packager rpm --target artifacts/ -f nfpm.yaml

      # --- Сбор артефактов ---
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          if [ "${{ matrix.target }}" = "linux" ]; then
            ARCHIVE=$(find fyne-cross/dist/linux-amd64 -maxdepth 1 -name '*.tar.xz' | head -n1)
            cp "$ARCHIVE" artifacts/codepic-linux-amd64.tar.xz
            cp codepic-cli-linux-amd64 artifacts/codepic-cli-linux-amd64
          else
            ARCHIVE=$(find fyne-cross/dist/windows-amd64 -maxdepth 1 -name '*.zip' | head -n1)
            cp "$ARCHIVE" artifacts/codepic-windows-amd64.zip
            cp codepic-cli-windows-amd64.exe artifacts/codepic-cli-windows-amd64.exe
          fi
          echo "=== artifacts ==="
          ls -lah artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List all files
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/codepic-linux-amd64.tar.xz
            artifacts/codepic-cli-linux-amd64
            artifacts/codepic-linux-amd64.deb
            artifacts/codepic-linux-amd64.rpm
            artifacts/codepic-windows-amd64.zip
            artifacts/codepic-cli-windows-amd64.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}